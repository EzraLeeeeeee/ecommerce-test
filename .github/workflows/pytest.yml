name: Automated Tests

on: [push, pull_request]

permissions:
  contents: write # 允许写入 GitHub Pages 分支

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠 Debug repository structure
        run: |
          pwd
          ls -lah

      - name: 📥 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest
          pip install pytest-html

      - name: 🛠 Clear GitHub Actions Cache
        run: |
          rm -rf ~/.cache/
          rm -rf ~/.m2/

      - name: 🛠️ Install Google Chrome and ChromeDriver
        run: |
          sudo apt update
          sudo apt install -y google-chrome-stable
          sudo apt install -y chromium-chromedriver

      - name: 📦 Install JMeter
        run: |
          wget https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter

      - name: 🔧 Add JMeter to PATH
        run: echo "$GITHUB_WORKSPACE/jmeter/bin" >> $GITHUB_PATH

      - name: 🛠 Check JMeter Installation
        run: |
          which jmeter
          jmeter -v

      - name: 🔍 Debug File Paths
        run: |
          pwd
          ls -lah
          ls -lah tests/
          ls -lah tests/jmeter/

      - name: 🔥 Run JMeter Test
        run: jmeter -n -t $GITHUB_WORKSPACE/tests/jmeter/New_Saucedemo_test.jmx -l new_results1.jtl

      - name: 🛠 Debug JMeter Results
        run: |
          if [ -s new_results1.jtl ]; then
            echo "✅ JTL 文件存在并且不是空的"
          else
            echo "❌ JTL 文件不存在或为空"
            exit 1
          fi

      - name: 🔍 Debug JMeter Test File
        run: ls -lah $GITHUB_WORKSPACE/tests/jmeter/

      - name: 📊 Generate JMeter Report
        run: jmeter -g new_results1.jtl -o jmeter-report

      - name: 📤 Upload JMeter Report
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-test-report
          path: jmeter-report

      - name: 🚀 Run API Tests (pytest + Allure)
        run: |
          pytest API_Test/Test_API.py --alluredir=allure-results

      - name: 🎯 Run Selenium UI Tests (Headless Mode)
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          pytest tests/test_checkout.py --browser=chrome --html=report.html --self-contained-html --alluredir=allure-results

      - name: 📊 Generate Allure report
        run: allure generate allure-results -o allure-report --clean

      - name: 📤 Upload Allure report (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: allure-test-report
          path: allure-report

      - name: 📤 Upload HTML test report (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: html-test-report
          path: report.html

      - name: 🚀 Deploy Allure Report to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # GitHub Pages 分支
          folder: allure-report # 部署的目录
